spring.application.name=mtg

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

groq.api.key=${GROQ_API_KEY:}

app.encryption.key=${ENCRYPTION_KEY}
# AI layer: Groq free tier, open-weight gpt-oss-20b (Apache 2.0). Without a real key the app uses deterministic fallback recipes.
groq.model=openai/gpt-oss-20b
groq.timeout-ms=6000

# Epic 5: suppress analytics cohorts smaller than this (raise for real data; 2 suits the 5 demo personas)
app.analytics.min-cohort=2

# The H2 console is dev-only; never expose it pointing at Neon
spring.h2.console.enabled=false

# Render (and other hosts) give the port in $PORT; 8080 locally
server.port=${PORT:8080}

# Staff logins (set real values in env vars; defaults are for local dev only)
app.users.volunteer-password=${VOLUNTEER_PASSWORD:volunteer}
app.users.manager-password=${MANAGER_PASSWORD:manager}

# Closing the shopper tab ends the visit after this many seconds (a reload within the window keeps it)
app.session.leave-grace-seconds=15
